<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff0080">
        <animate attributeName="stop-color" values="#ff0080;#7928ca;#00dfd8;#ff0080" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7928ca">
        <animate attributeName="stop-color" values="#7928ca;#00dfd8;#ff0080;#7928ca" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00dfd8">
        <animate attributeName="stop-color" values="#00dfd8;#ff0080;#7928ca;#00dfd8" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="50" r="2"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="110" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="280" cy="40" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="75" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="35" r="2"><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="690" cy="95" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="45" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="120" r="2"><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="60" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="170" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="2.9s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="180" r="1.5"><animate attributeName="opacity" values="0;1;0" dur="3.3s" begin="1.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- floating title -->
  <g filter="url(#glow)">
    <text x="500" y="130" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="#ffffff">Adib Labib
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="4s" repeatCount="indefinite"/>
    </text>
  </g>
  <text x="500" y="178" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#ffffff" letter-spacing="3">FRONTEND DEVELOPER  •  INDONESIA
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- moving waves -->
  <path d="M0,215 q125,-45 250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 V300 H0 Z" fill="#ffffff" fill-opacity="0.15">
    <animateTransform attributeName="transform" type="translate" from="0,0" to="-500,0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path d="M0,240 q125,40 250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 V300 H0 Z" fill="#0d1117" fill-opacity="0.35">
    <animateTransform attributeName="transform" type="translate" from="-500,0" to="0,0" dur="12s" repeatCount="indefinite"/>
  </path>
  <path d="M0,262 q125,-30 250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 t250,0 V300 H0 Z" fill="#0d1117">
    <animateTransform attributeName="transform" type="translate" from="0,0" to="-500,0" dur="7s" repeatCount="indefinite"/>
  </path>
</svg>
